services:
  api:
    build: .
    container_name: infrastructure-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:password@infrastructure-db:5432/infrastructure
    restart: always
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: infrastructure-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: infrastructure
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
