name: InfrastructureManager CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Wait for services
        run: sleep 10

      - name: Test API health
        run: curl --fail http://localhost:8000/health

      - name: Test servers API
        run: curl --fail http://localhost:8000/servers

      - name: Run pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx2
          pytest

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Show logs
        if: always()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t marcello448/infrastructure-manager:latest .

      - name: Push Docker image
        run: docker push marcello448/infrastructure-manager:latest
